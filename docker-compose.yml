services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tavi_user
      POSTGRES_PASSWORD: tavi_password
      POSTGRES_DB: tavi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      PORT: "3456"
      DATABASE_URL: "postgresql://tavi_user:tavi_password@postgres:5432/tavi?schema=public"
      NEXTAUTH_URL: "http://localhost:3456"
      NEXTAUTH_SECRET: "production-tavi-secret-replace-me"
      ACCOUNT_ADMISSION_MODE: "invitation-only"
      AI_PROVIDER: "auto"
      COPILOT_MODEL: "gpt-5.6-terra"
      AZURE_OPENAI_DEPLOYMENT: "gpt-6.1-sol"
      AZURE_OPENAI_VISION_DEPLOYMENT: "gpt-5.6-terra"
    depends_on:
      - postgres

volumes:
  pgdata:
